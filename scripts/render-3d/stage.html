// ---------- helpers ----------
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
const smooth = (a, b, x) => ease((x - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const rad = (d) => (d * Math.PI) / 180;

function txt(g, s, x, y, size, color, weight = 500, align = 'left') {
  g.font = `${weight} ${size}px ${FONT}`;
  g.fillStyle = color;
  g.textAlign = align;
  g.textBaseline = 'middle';
  g.fillText(s, x, y);
}
function panel(g, x, y, w, h, r, fill = 'rgba(15,23,42,0.78)', stroke = 'rgba(148,163,184,0.2)') {
  g.beginPath(); g.roundRect(x, y, w, h, r);
  g.fillStyle = fill; g.fill();
  g.lineWidth = 1.5; g.strokeStyle = stroke; g.stroke();
}
function pill(g, x, y, w, h, label, c, size = 13) {
  g.beginPath(); g.roundRect(x, y, w, h, h / 2);
  g.fillStyle = c + '26'; g.fill();
  g.lineWidth = 1.2; g.strokeStyle = c + '99'; g.stroke();
  txt(g, label, x + w / 2, y + h / 2, size, c, 700, 'center');
}
function canvasTex(c) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function layer(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  return { c, g: c.getContext('2d') };
}

// ---------- keyboard texture ----------
function makeKeysTex() {
  const k = layer(1024, 360);
  const rows = 5, cols = 15, pad = 10;
  const kw = (1024 - 2 * pad) / cols, kh = (360 - 2 * pad) / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    k.g.beginPath();
    k.g.roundRect(pad + c * kw + 3, pad + r * kh + 3, kw - 6, kh - 6, 12);
    k.g.fillStyle = '#2b2f38'; k.g.fill();
  }
  return canvasTex(k.c);
}

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

  txt(g, 'Google Play · App Store', 26, 118, 14, '#94a3b8', 500);

  const apps = [
    { n: ['Family Health'], c: '#10b981', l: 'FH' },
    { n: ['Connect Car', 'Booking'], c: '#3b82f6', l: 'CC' },
    { n: ['GPLX 600'], c: '#f97316', l: '60' },
    { n: ['FamHub'], c: '#8b5cf6', l: 'FA' },
  ];
  const act = Math.floor(ph * 4) % 4;
  apps.forEach((a, i) => {
    const x = 24 + (i % 2) * 172, y = 132 + Math.floor(i / 2) * 186, w = 164, h = 178;
    panel(g, x, y, w, h, 22, 'rgba(30,41,59,0.85)', i === act ? '#38bdf8' : 'rgba(148,163,184,0.18)');
    if (i === act) { g.shadowColor = '#38bdf8'; g.shadowBlur = 18; panel(g, x, y, w, h, 22, 'rgba(30,41,59,0.85)', '#38bdf8'); g.shadowBlur = 0; }
    g.beginPath(); g.roundRect(x + 16, y + 16, 48, 48, 14); g.fillStyle = a.c; g.fill();
    txt(g, a.l, x + 40, y + 40, 16, '#ffffff', 800, 'center');
    a.n.forEach((line, k) => txt(g, line, x + 16, y + 88 + k * 20, 16, '#f1f5f9', 700));
    const by = y + h - 48;
    pill(g, x + 14, by, 136, 20, 'Google Play', '#34d399', 11);
    pill(g, x + 14, by + 24, 136, 20, 'App Store', '#60a5fa', 11);
  });

  const cy = 512;
  panel(g, 24, cy, 342, 310, 24);
  txt(g, 'Connect Car · live', 44, cy + 30, 16, '#f1f5f9', 700);
  pill(g, 262, cy + 18, 86, 22, 'LIVE', '#ef4444', 11);
  g.save();
  g.beginPath(); g.roundRect(40, cy + 52, 310, 170, 18); g.clip();
  g.fillStyle = '#0f172a'; g.fillRect(40, cy + 52, 310, 170);
  g.strokeStyle = 'rgba(148,163,184,0.12)'; g.lineWidth = 1;
  for (let x = 40; x <= 350; x += 31) { g.beginPath(); g.moveTo(x, cy + 52); g.lineTo(x, cy + 222); g.stroke(); }
  for (let y = cy + 52; y <= cy + 222; y += 26) { g.beginPath(); g.moveTo(40, y); g.lineTo(350, y); g.stroke(); }
  const P0 = [70, cy + 200], C = [200, cy + 110], P1 = [322, cy + 84];
  g.setLineDash([6, 6]); g.strokeStyle = '#38bdf8'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(...P0); g.quadraticCurveTo(...C, ...P1); g.stroke();
  g.setLineDash([]);
  const u = 0.15 + 0.7 * (0.5 + 0.5 * Math.sin(t));
  const cx = (1 - u) * (1 - u) * P0[0] + 2 * (1 - u) * u * C[0] + u * u * P1[0];
  const cyy = (1 - u) * (1 - u) * P0[1] + 2 * (1 - u) * u * C[1] + u * u * P1[1];
  g.beginPath(); g.arc(cx, cyy, 14, 0, Math.PI * 2); g.fillStyle = 'rgba(56,189,248,0.3)'; g.fill();
  g.beginPath(); g.arc(cx, cyy, 6, 0, Math.PI * 2); g.fillStyle = '#38bdf8'; g.fill();
  g.beginPath(); g.arc(P1[0], P1[1], 7, 0, Math.PI * 2); g.fillStyle = '#f97316'; g.fill();
  g.restore();
  txt(g, 'Driver 3 min away', 44, cy + 248, 15, '#cbd5e1', 600);
  txt(g, 'Booking confirmed ✓', 44, cy + 276, 16, '#6ee7b7', 700);
  g.restore();
}

const LAY_AI = layer(1024, 616);
const LAY_CRM = layer(1024, 616);
const phoneG = phoneCv.g;

// ---------- palettes (rim light colours per act) ----------
const P1 = [new THREE.Color('#38bdf8'), new THREE.Color('#6366f1')];
const P2 = [new THREE.Color('#10b981'), new THREE.Color('#3b82f6')];
const P3 = [new THREE.Color('#8b5cf6'), new THREE.Color('#f59e0b')];

// ---------- frame state ----------
function setFrame(f) {
  const s1 = smooth(20.5, 21.5, f);   // act 1 -> act 2 (boundary frames only)
  const s2 = smooth(40.5, 41.5, f);   // act 2 -> act 3 (boundary frames only)
  const ph = f / 60;

  // laptop screen: AI dashboard (act 1) crossfades into CRM (act 2+)
  drawAI(LAY_AI.g, ph);
  drawCRM(LAY_CRM.g, ph);
  const sg = screenCv.g;
  sg.globalAlpha = 1;
  sg.drawImage(LAY_AI.c, 0, 0);
  sg.globalAlpha = s1;
  sg.drawImage(LAY_CRM.c, 0, 0);
  sg.globalAlpha = 1;
  screenTex.needsUpdate = true;

  // phone screen (act 3)
  phoneG.setTransform(1, 0, 0, 1, 0, 0);
  phoneG.clearRect(0, 0, 780, 1688);
  phoneG.setTransform(2, 0, 0, 2, 0, 0);
  drawStore(phoneG, ph);
  phoneG.setTransform(1, 0, 0, 1, 0, 0);
  phoneTex.needsUpdate = true;

  // laptop yaw: act 1 -28 -> -5, act 2 -5 -> +22, act 3 +22 -> +35
  let yaw;
  if (f <= 20) yaw = lerp(-28, -5, ease((f - 1) / 19));
  else if (f <= 40) yaw = lerp(-5, 22, ease((f - 20) / 20));
  else yaw = lerp(22, 35, ease((f - 40) / 20));
  laptop.rotation.y = rad(yaw);

  // phone orbit-in during act 3
  const pe = smooth(38.5, 48.5, f);
  phone.visible = pe > 0.002;
  phone.scale.setScalar(lerp(0.7, 1, pe));
  phone.position.set(lerp(3.4, 1.55, pe), lerp(0.2, 0.86, pe) + 0.35 * Math.sin(Math.PI * pe), lerp(-1.6, 0.85, pe));
  phone.rotation.y = lerp(0.9, -0.22, pe);
  laptop.position.x = -0.55 * pe;

  // palettes
  rimA.color.copy(P1[0]).lerp(P2[0], s1).lerp(P3[0], s2);
  rimB.color.copy(P1[1]).lerp(P2[1], s1).lerp(P3[1], s2);

  // telemetry cards per act
  const weights = [1 - s1, s1 * (1 - s2), s2];
  for (const c of cards) {
    const w = weights[c.act - 1];
    c.mat.opacity = w * 0.95;
    c.mesh.visible = w > 0.001;
    const bob = 0.07 * Math.sin(f * 0.32 + c.idx * 1.7);
    c.mesh.position.y = c.pos[1] + bob;
  }
}

window.renderFrame = (f) => {
  setFrame(f);
  renderer.render(scene, camera);
  return canvas.toDataURL('image/png');
};
window.__ready = true;
</script>
